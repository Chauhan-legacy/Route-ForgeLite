<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RouteForge - Collaborative Route Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Leaflet CDN with fallback styling -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <?!= include('Styles'); ?>
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-section">
        <span class="brand-logo">RouteForge</span>
        <span class="brand-target-badge">Apps Script</span>
        <input type="text" id="routeTitle" class="route-title-input" value="Untitled Route" placeholder="Route Name" title="Click to rename route" />
      </div>

      <div class="top-actions">
        <div class="sync-pill" id="syncPill" title="Server Sync Status">
          <div class="sync-dot" id="syncDot"></div>
          <span id="syncText">Connected</span>
        </div>

        <button class="btn btn-sm" onclick="copyShareUrl()" title="Copy shareable link">
          Share Link
        </button>

        <button class="btn btn-sm" onclick="exportCSV()" title="Export stops as protected CSV">
          Export CSV
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="control-row">
            <button class="btn btn-sm" onclick="openImportModal()" style="flex: 1;">
              📥 Import Addresses / CSV
            </button>
          </div>

          <form id="addStopForm" class="add-stop-form">
            <input type="text" id="addStopInput" class="text-input" placeholder="Add address or location..." required />
            <button type="submit" class="btn btn-primary btn-sm">Add</button>
          </form>
        </div>

        <!-- Stop List Items -->
        <div class="stop-list-container" id="stopList">
          <div class="empty-state">Loading route stops...</div>
        </div>

        <!-- Summary & Action Buttons -->
        <div class="sidebar-footer">
          <div class="summary-metrics">
            <div>Stops: <span id="stopCount" class="metric-value">0</span></div>
            <div>Distance: <span id="totalDist" class="metric-value">0 km</span></div>
            <div>Duration: <span id="totalTime" class="metric-value">0 min</span></div>
          </div>
          <div style="font-size:0.75rem; color: var(--text-muted);">
            Engine: <span id="routeType" style="font-weight:600; color:var(--text-secondary);">Not calculated</span>
          </div>

          <div class="route-action-buttons">
            <button class="btn btn-primary" onclick="calculateRoute('osrm')">
              Calculate Road
            </button>
            <button class="btn" onclick="optimizeRoute()" style="background:#1e3a5f; color:#93c5fd; border-color:#2563eb;">
              ⚡ Optimize
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Map Area -->
      <section class="map-container">
        <!-- Floating Alert Banner -->
        <div id="alertBanner" class="alert-banner banner-warning" style="display: none;">
          <span id="alertMessage">Alert notification</span>
          <button class="icon-btn" onclick="dismissAlert()" style="margin-left:auto; color:inherit;">×</button>
        </div>

        <div id="map"></div>
      </section>
    </main>
  </div>

  <!-- CSV / Paste Import Modal -->
  <div id="importModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Import Stops</h3>
        <button class="icon-btn" onclick="closeImportModal()">×</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary);">Paste multiple addresses (one per line) or CSV rows:</p>
        <textarea id="pasteAddresses" class="textarea-input" placeholder="Stephansplatz 3, 1010 Wien&#10;Praterstern 1, 1020 Wien&#10;Schönbrunner Schloßstraße 47, 1130 Wien"></textarea>
        <div id="importError" style="color: #f87171; font-size: 0.8rem; display: none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" onclick="closeImportModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="processImport()">Import & Geocode</button>
      </div>
    </div>
  </div>

  <?!= include('JavaScript'); ?>
</body>
</html>
